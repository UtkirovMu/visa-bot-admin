<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBB03B">
<title>Admin panel — Turan Int. School</title>
<link rel="icon" href="/mark.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
  <!-- Kirish tekshirilmoqda / ruxsat yo'q -->
  <section id="gate" class="gate">
    <img src="/mark.png" alt="" class="gate-mark spin">
    <h1 id="gateTitle">Yuklanmoqda…</h1>
    <p id="gateText" class="muted"></p>
  </section>

  <div id="app" class="hidden">
    <header class="top">
      <img src="/mark.png" alt="" class="top-mark">
      <div class="top-text">
        <b>Admin panel</b>
        <span id="hello" class="muted">Turan Int. School</span>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="Yangilash">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </header>

    <main class="wrap">
      <section class="stats" aria-label="Statistika">
        <button class="stat" data-filter="all" type="button"><span id="stAll">0</span><small>Jami</small></button>
        <button class="stat ok" data-filter="issued" type="button"><span id="stIssued">0</span><small>Viza chiqdi</small></button>
        <button class="stat wait" data-filter="progress" type="button"><span id="stProgress">0</span><small>Jarayonda</small></button>
        <button class="stat bad" data-filter="problem" type="button"><span id="stProblem">0</span><small>Topilmadi / xato</small></button>
      </section>

      <section class="sched card">
        <div class="sched-row">
          <div>
            <small class="muted">Avtomatik tekshiruv</small>
            <b id="nextRun">—</b>
            <span id="times" class="muted times"></span>
          </div>
          <button id="checkAllBtn" class="btn btn-dark btn-sm" type="button">Hammasini tekshirish</button>
        </div>
        <div id="runBox" class="run hidden">
          <div class="bar"><span id="runBar"></span></div>
          <small id="runText" class="muted"></small>
        </div>
      </section>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Qidirish: ism yoki pasport" autocomplete="off" spellcheck="false">
        <button id="addBtn" class="btn btn-primary btn-sm" type="button">+ Qo'shish</button>
      </div>
      <p id="filterInfo" class="filter-info hidden"></p>

      <section id="list" class="list" aria-live="polite"></section>
      <p id="empty" class="empty hidden">Hali hech kim qo'shilmagan. «+ Qo'shish» tugmasini bosing.</p>
    </main>
  </div>

  <!-- Qo'shish oynasi -->
  <div id="addSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="sheet-backdrop" data-close></div>
    <form id="addForm" class="sheet-body" novalidate autocomplete="off">
      <div class="sheet-head">
        <h2 id="addTitle">Yangi odam qo'shish</h2>
        <button type="button" class="icon-btn" data-close aria-label="Yopish">✕</button>
      </div>
      <label>Pasport raqami<input name="passport" placeholder="FB1234567" maxlength="12" class="upper" required></label>
      <div class="row">
        <label>Familiya<input name="surname" placeholder="FALONCHIYEV" maxlength="40" class="upper" required></label>
        <label>Ism<input name="name" placeholder="FALONCHI" maxlength="40" class="upper" required></label>
      </div>
      <label>Otasining ismi <span class="muted">(pasportda bo'lsa)</span><input name="patronymic" placeholder="FALONCHI UGLI / KIZI" maxlength="40" class="upper"></label>
      <label>Tug'ilgan sana<input name="birthDate" type="date" min="1920-01-01" required></label>
      <label>Izoh <span class="muted">(ixtiyoriy: guruh, telefon…)</span><input name="note" maxlength="120" placeholder="Masalan: 2026 bahor, 3-guruh"></label>
      <p id="addError" class="alert hidden" role="alert"></p>
      <button type="submit" class="btn btn-primary" id="addSubmit">Saqlash</button>
      <label class="check"><input type="checkbox" name="checkNow" checked> Saqlangach darhol tekshirish</label>
    </form>
  </div>

  <!-- Tafsilot oynasi -->
  <div id="detailSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body">
      <div class="sheet-head">
        <h2 id="dName"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Yopish">✕</button>
      </div>
      <div id="dStatus" class="d-status"></div>
      <div id="dPdfBox" class="pdf-box hidden">
        <button id="dPdf" class="btn btn-pdf" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Elektron vizani yuklab olish</span>
        </button>
        <small id="dPdfNote" class="muted">PDF Telegram'ga, bot chatiga yuboriladi</small>
      </div>
      <dl id="dInfo" class="dl"></dl>
      <div class="d-actions">
        <button id="dCheck" class="btn btn-primary" type="button">Hozir tekshirish</button>
        <button id="dDelete" class="btn btn-ghost danger" type="button">O'chirish</button>
      </div>
      <h3>Tekshiruvlar tarixi</h3>
      <ul id="dHistory" class="history"></ul>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
